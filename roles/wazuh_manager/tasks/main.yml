---
- name: Validate manager node type
  ansible.builtin.assert:
    that:
      - wazuh_manager_type | default('worker') in ['master', 'worker']
    fail_msg: "wazuh_manager_type must be master or worker."

- name: Install Wazuh manager component
  ansible.builtin.command:
    cmd: "bash ./wazuh-install.sh --wazuh-server {{ wazuh_manager_name | default(inventory_hostname ~ '-manager') }}"
    chdir: "{{ wazuh_install_workdir }}"
    creates: /var/ossec/etc/ossec.conf
  register: wazuh_manager_install
  no_log: true

- name: Check active TCP listeners before Wazuh manager start
  ansible.builtin.command:
    cmd: ss -H -lntp
  register: wazuh_manager_tcp_listeners_before_start
  changed_when: false
  failed_when: false

- name: Stop HAProxy if it is blocking local Wazuh manager ports
  ansible.builtin.service:
    name: haproxy
    enabled: false
    state: stopped
  when:
    - "'wazuh_loadbalancers' in group_names"
    - (wazuh_manager_tcp_listeners_before_start.stdout_lines | default([]) | select('search', ':(1514|1515|55000)\\b') | select('search', 'haproxy') | list | length) > 0

- name: Stop NGINX if it is blocking local Wazuh manager ports
  ansible.builtin.service:
    name: nginx
    enabled: false
    state: stopped
  when:
    - "'wazuh_loadbalancers' in group_names"
    - (wazuh_manager_tcp_listeners_before_start.stdout_lines | default([]) | select('search', ':(1514|1515|55000)\\b') | select('search', 'nginx') | list | length) > 0

- name: Create Wazuh manager systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/wazuh-manager.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Wazuh manager start timeout
  ansible.builtin.copy:
    dest: /etc/systemd/system/wazuh-manager.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      TimeoutStartSec={{ wazuh_manager_start_timeout_sec | default(300) }}
  register: wazuh_manager_systemd_override

- name: Reload systemd after Wazuh manager override changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: wazuh_manager_systemd_override.changed

- name: Ensure Wazuh manager service is enabled and started
  block:
    - name: Start Wazuh manager service
      ansible.builtin.service:
        name: wazuh-manager
        enabled: true
        state: started
  rescue:
    - name: Collect Wazuh manager systemd status
      ansible.builtin.command:
        cmd: systemctl status wazuh-manager --no-pager -l
      register: wazuh_manager_systemd_status
      changed_when: false
      failed_when: false

    - name: Collect recent Wazuh manager journal
      ansible.builtin.command:
        cmd: journalctl -u wazuh-manager -n 100 --no-pager
      register: wazuh_manager_journal
      changed_when: false
      failed_when: false

    - name: Collect Wazuh manager log tail
      ansible.builtin.command:
        cmd: tail -n 120 /var/ossec/logs/ossec.log
      register: wazuh_manager_log_tail
      changed_when: false
      failed_when: false

    - name: Collect Wazuh manager component status
      ansible.builtin.command:
        cmd: /var/ossec/bin/wazuh-control status
      register: wazuh_manager_component_status
      changed_when: false
      failed_when: false

    - name: Check Wazuh manager directories
      ansible.builtin.command:
        cmd: ls -ld /var/ossec /var/ossec/etc /var/ossec/logs
      register: wazuh_manager_directory_status
      changed_when: false
      failed_when: false

    - name: Collect active TCP listeners after Wazuh manager failure
      ansible.builtin.command:
        cmd: ss -H -lntp
      register: wazuh_manager_tcp_listeners_after_failure
      changed_when: false
      failed_when: false

    - name: Report Wazuh manager startup diagnostics
      ansible.builtin.fail:
        msg: |
          Wazuh manager service failed to start on {{ inventory_hostname }}.

          systemctl status wazuh-manager:
          {{ wazuh_manager_systemd_status.stdout | default(wazuh_manager_systemd_status.stderr | default('unavailable')) }}

          journalctl -u wazuh-manager -n 100:
          {{ wazuh_manager_journal.stdout | default(wazuh_manager_journal.stderr | default('unavailable')) }}

          /var/ossec/logs/ossec.log tail:
          {{ wazuh_manager_log_tail.stdout | default(wazuh_manager_log_tail.stderr | default('unavailable')) }}

          /var/ossec/bin/wazuh-control status:
          {{ wazuh_manager_component_status.stdout | default(wazuh_manager_component_status.stderr | default('unavailable')) }}

          Wazuh manager directories:
          {{ wazuh_manager_directory_status.stdout | default(wazuh_manager_directory_status.stderr | default('unavailable')) }}

          Active TCP listeners:
          {{ wazuh_manager_tcp_listeners_after_failure.stdout | default(wazuh_manager_tcp_listeners_after_failure.stderr | default('unavailable')) }}

- name: Ensure Filebeat service is enabled and started
  ansible.builtin.service:
    name: filebeat
    enabled: true
    state: started
