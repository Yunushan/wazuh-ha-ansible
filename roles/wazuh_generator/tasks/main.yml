---
- name: Ensure local artifact directory exists on controller
  ansible.builtin.file:
    path: "{{ wazuh_controller_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Initialize Wazuh component name lists
  ansible.builtin.set_fact:
    wazuh_indexer_names_resolved: []
    wazuh_manager_names_resolved: []
    wazuh_dashboard_names_resolved: []

- name: Build Wazuh indexer component name list
  ansible.builtin.set_fact:
    wazuh_indexer_names_resolved: "{{ wazuh_indexer_names_resolved + [hostvars[item].wazuh_indexer_name | default(item ~ '-indexer')] }}"
  loop: "{{ groups.get('wazuh_indexers', []) }}"

- name: Build Wazuh manager component name list
  ansible.builtin.set_fact:
    wazuh_manager_names_resolved: "{{ wazuh_manager_names_resolved + [hostvars[item].wazuh_manager_name | default(item ~ '-manager')] }}"
  loop: "{{ groups.get('wazuh_managers', []) }}"

- name: Build Wazuh dashboard component name list
  ansible.builtin.set_fact:
    wazuh_dashboard_names_resolved: "{{ wazuh_dashboard_names_resolved + [hostvars[item].wazuh_dashboard_name | default(item ~ '-dashboard')] }}"
  loop: "{{ groups.get('wazuh_dashboards', []) }}"

- name: Validate Wazuh component names are unique
  ansible.builtin.assert:
    that:
      - (wazuh_indexer_names_resolved + wazuh_manager_names_resolved + wazuh_dashboard_names_resolved) | length == ((wazuh_indexer_names_resolved + wazuh_manager_names_resolved + wazuh_dashboard_names_resolved) | unique | list | length)
    fail_msg: >-
      Wazuh component names must be unique across indexer, manager, and dashboard sections.
      Use component names like indexer-1, manager-1, and dashboard-1 even when they run on the same host.

- name: Render Wazuh installation assistant config.yml
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ wazuh_install_workdir }}/config.yml"
    owner: root
    group: root
    mode: "0600"

- name: Fetch rendered config to controller for audit
  ansible.builtin.fetch:
    src: "{{ wazuh_install_workdir }}/config.yml"
    dest: "{{ wazuh_controller_artifacts_dir }}/config.yml"
    flat: true
  no_log: true

- name: Download Wazuh installation assistant
  ansible.builtin.get_url:
    url: "{{ wazuh_install_assistant_url }}"
    dest: "{{ wazuh_install_workdir }}/wazuh-install.sh"
    mode: "0700"
    force: true

- name: Pin Wazuh assistant major.minor channel for exact patch requests
  ansible.builtin.replace:
    path: "{{ wazuh_install_workdir }}/wazuh-install.sh"
    regexp: '(?m)^readonly wazuh_major="[0-9]+[.][0-9]+"$'
    replace: 'readonly wazuh_major="{{ wazuh_version_channel }}"'
  when: wazuh_version_is_exact | bool

- name: Pin Wazuh assistant package version for exact patch requests
  ansible.builtin.replace:
    path: "{{ wazuh_install_workdir }}/wazuh-install.sh"
    regexp: '(?m)^readonly wazuh_version="[0-9]+[.][0-9]+[.][0-9]+"$'
    replace: 'readonly wazuh_version="{{ wazuh_resolved_version }}"'
  when: wazuh_version_is_exact | bool

- name: Read pinned Wazuh assistant for verification
  ansible.builtin.slurp:
    src: "{{ wazuh_install_workdir }}/wazuh-install.sh"
  register: wazuh_install_assistant_content
  when: wazuh_version_is_exact | bool

- name: Verify exact Wazuh package pin
  ansible.builtin.assert:
    that:
      - (wazuh_install_assistant_content.content | b64decode | regex_search('(?m)^readonly wazuh_version="' ~ (wazuh_resolved_version | regex_escape) ~ '"$')) is not none
      - (wazuh_install_assistant_content.content | b64decode | regex_search('(?m)^readonly wazuh_major="' ~ (wazuh_version_channel | regex_escape) ~ '"$')) is not none
    fail_msg: "Downloaded Wazuh assistant could not be pinned to {{ wazuh_resolved_version }}."
  when: wazuh_version_is_exact | bool

- name: Generate Wazuh certificates, cluster key, and passwords
  ansible.builtin.command:
    cmd: bash ./wazuh-install.sh --generate-config-files
    chdir: "{{ wazuh_install_workdir }}"
    creates: "{{ wazuh_install_workdir }}/wazuh-install-files.tar"
  register: wazuh_generate_result
  no_log: true

- name: Fetch generated Wazuh installation bundle to controller
  ansible.builtin.fetch:
    src: "{{ wazuh_install_workdir }}/wazuh-install-files.tar"
    dest: "{{ wazuh_controller_artifacts_dir }}/wazuh-install-files.tar"
    flat: true
  no_log: true

- name: Fetch Wazuh installation assistant to controller
  ansible.builtin.fetch:
    src: "{{ wazuh_install_workdir }}/wazuh-install.sh"
    dest: "{{ wazuh_controller_artifacts_dir }}/wazuh-install.sh"
    flat: true
