---
- name: Require explicit Wazuh indexer snapshot restore confirmation
  ansible.builtin.assert:
    that:
      - wazuh_indexer_snapshot_repository_enabled | default(false) | bool
      - wazuh_indexer_snapshot_repository_name | default('') | length > 0
      - wazuh_indexer_snapshot_restore_name | default('') | length > 0
      - wazuh_indexer_snapshot_restore_confirm | default('') == wazuh_indexer_snapshot_restore_required_confirm | default('RESTORE_WAZUH_INDEXER_SNAPSHOT')
    fail_msg: >-
      Snapshot restore is destructive if rename settings are disabled. Set
      wazuh_indexer_snapshot_restore_confirm={{ wazuh_indexer_snapshot_restore_required_confirm | default('RESTORE_WAZUH_INDEXER_SNAPSHOT') }}
      and wazuh_indexer_snapshot_restore_name before running this playbook.

- name: Build Wazuh indexer snapshot restore request
  ansible.builtin.set_fact:
    wazuh_indexer_snapshot_restore_body: >-
      {{
        {
          'indices': wazuh_indexer_snapshot_restore_indices,
          'ignore_unavailable': true,
          'include_global_state': (wazuh_indexer_snapshot_restore_include_global_state | default(false) | bool)
        }
        | combine(
          {
            'rename_pattern': wazuh_indexer_snapshot_restore_rename_pattern,
            'rename_replacement': wazuh_indexer_snapshot_restore_rename_replacement
          }
          if (wazuh_indexer_snapshot_restore_rename_pattern | default('') | length > 0)
          else {}
        )
      }}

- name: Restore Wazuh indexer snapshot
  ansible.builtin.uri:
    url: "https://{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}:9200/_snapshot/{{ wazuh_indexer_snapshot_repository_name }}/{{ wazuh_indexer_snapshot_restore_name }}/_restore?wait_for_completion={{ 'true' if (wazuh_indexer_snapshot_restore_wait_for_completion | default(true) | bool) else 'false' }}"
    method: POST
    client_cert: /etc/wazuh-indexer/certs/admin.pem
    client_key: /etc/wazuh-indexer/certs/admin-key.pem
    validate_certs: false
    body_format: json
    body: "{{ wazuh_indexer_snapshot_restore_body }}"
    return_content: true
    status_code:
      - 200
      - 202
  register: wazuh_indexer_snapshot_restore_result
  changed_when: true

- name: Report Wazuh indexer snapshot restore
  ansible.builtin.debug:
    msg: >-
      Snapshot {{ wazuh_indexer_snapshot_restore_name }} restore requested
      from repository {{ wazuh_indexer_snapshot_repository_name }}.
      Response={{ wazuh_indexer_snapshot_restore_result.json | default({}) }}.
