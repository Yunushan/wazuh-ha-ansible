---
- name: Normalize Wazuh version selector
  ansible.builtin.set_fact:
    wazuh_version_selector: "{{ wazuh_version | string | trim }}"
    wazuh_version_selector_normalized: "{{ wazuh_version | string | trim | lower }}"

- name: Resolve Wazuh version selector
  ansible.builtin.set_fact:
    wazuh_resolved_version: "{{ (wazuh_stable_version if wazuh_version_selector_normalized == 'stable' else wazuh_latest_version if wazuh_version_selector_normalized == 'latest' else wazuh_version_selector) | string | trim }}"

- name: Validate Wazuh version selector
  ansible.builtin.assert:
    that:
      - wazuh_version_selector_normalized in ['stable', 'latest'] or wazuh_version_selector is match('^[0-9]+[.][0-9]+([.][0-9]+)?$')
      - wazuh_resolved_version is match('^[0-9]+[.][0-9]+([.][0-9]+)?$')
    fail_msg: >-
      wazuh_version must be stable, latest, a channel such as 4.14, or an exact patch such as 4.14.5.
      If using stable/latest, set wazuh_stable_version or wazuh_latest_version to a numeric channel or exact patch.

- name: Build Wazuh installer version facts
  ansible.builtin.set_fact:
    wazuh_version_channel: "{{ wazuh_resolved_version | regex_replace('^([0-9]+[.][0-9]+)([.][0-9]+)?$', '\\1') }}"
    wazuh_version_is_exact: "{{ wazuh_resolved_version is match('^[0-9]+[.][0-9]+[.][0-9]+$') }}"
    wazuh_install_assistant_url: "{{ wazuh_packages_base_url | regex_replace('/+$', '') }}/{{ wazuh_resolved_version | regex_replace('^([0-9]+[.][0-9]+)([.][0-9]+)?$', '\\1') }}/wazuh-install.sh"

- name: Determine package family key
  ansible.builtin.set_fact:
    wazuh_package_family_key: "{{ ansible_os_family if ansible_os_family in wazuh_common_packages_by_family else (ansible_distribution if ansible_distribution in wazuh_common_packages_by_family else ansible_os_family) }}"

- name: Check legacy apt sources file
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: wazuh_apt_sources_list_stat
  when:
    - ansible_os_family == 'Debian'
    - wazuh_fix_apt_http_sources | default(true) | bool

- name: Find apt source fragments
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*.list"
      - "*.sources"
    file_type: file
  register: wazuh_apt_source_fragments
  when:
    - ansible_os_family == 'Debian'
    - wazuh_fix_apt_http_sources | default(true) | bool

- name: Build apt source file list
  ansible.builtin.set_fact:
    wazuh_apt_source_files: "{{ ([{'path': '/etc/apt/sources.list'}] if wazuh_apt_sources_list_stat.stat.exists | default(false) else []) + (wazuh_apt_source_fragments.files | default([])) }}"
  when:
    - ansible_os_family == 'Debian'
    - wazuh_fix_apt_http_sources | default(true) | bool

- name: Repair Ubuntu security apt source URLs to HTTPS
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'http://security[.]ubuntu[.]com/ubuntu'
    replace: 'https://security.ubuntu.com/ubuntu'
  loop: "{{ wazuh_apt_source_files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: wazuh_apt_security_source_repair
  when:
    - ansible_os_family == 'Debian'
    - wazuh_fix_apt_http_sources | default(true) | bool

- name: Repair Ubuntu archive apt source URLs to HTTPS
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'http://archive[.]ubuntu[.]com/ubuntu'
    replace: 'https://archive.ubuntu.com/ubuntu'
  loop: "{{ wazuh_apt_source_files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: wazuh_apt_archive_source_repair
  when:
    - ansible_os_family == 'Debian'
    - wazuh_fix_apt_http_sources | default(true) | bool

- name: Refresh apt cache after repairing Ubuntu apt sources
  ansible.builtin.apt:
    update_cache: true
  register: wazuh_apt_source_repair_update_result
  retries: 3
  delay: 5
  until: wazuh_apt_source_repair_update_result is succeeded
  when:
    - ansible_os_family == 'Debian'
    - wazuh_fix_apt_http_sources | default(true) | bool
    - >-
      (wazuh_apt_security_source_repair.results | default([]) | selectattr('changed') | list | length > 0)
      or
      (wazuh_apt_archive_source_repair.results | default([]) | selectattr('changed') | list | length > 0)

- name: Install common packages
  ansible.builtin.package:
    name: "{{ wazuh_common_packages_by_family.get(wazuh_package_family_key, ['bash', 'curl', 'tar', 'gzip', 'ca-certificates', 'openssl', 'python3', 'sudo']) }}"
    state: present
  register: wazuh_common_pkg_result
  retries: 3
  delay: 5
  until: wazuh_common_pkg_result is succeeded

- name: Ensure Wazuh work directory exists
  ansible.builtin.file:
    path: "{{ wazuh_install_workdir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure vm.max_map_count for indexer nodes
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: true
  when: "'wazuh_indexers' in group_names"
