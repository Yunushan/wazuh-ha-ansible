---
- name: Validate load balancer engine
  ansible.builtin.assert:
    that:
      - wazuh_load_balancer_engine in ['haproxy', 'nginx', 'none']
    fail_msg: "wazuh_load_balancer_engine must be haproxy, nginx, or none."

- name: Determine effective Keepalived state
  ansible.builtin.set_fact:
    wazuh_keepalived_effective_enabled: "{{ (wazuh_enable_keepalived | default(false) | bool) or (wazuh_lb_virtual_ip | default('') | length > 0) }}"

- name: Show effective Keepalived settings
  ansible.builtin.debug:
    msg: >-
      Keepalived effective_enabled={{ wazuh_keepalived_effective_enabled }},
      requested={{ wazuh_enable_keepalived | default(false) }},
      vip={{ wazuh_lb_virtual_ip | default('') }},
      interface={{ wazuh_keepalived_interface | default('eth0') }}.

- name: Determine effective load balancer frontend ports
  ansible.builtin.set_fact:
    wazuh_lb_effective_agent_events_frontend_port: "{{ 15140 if ('wazuh_managers' in group_names and (wazuh_lb_agent_events_frontend_port | default(1514) | int) == 1514) else (wazuh_lb_agent_events_frontend_port | default(1514) | int) }}"
    wazuh_lb_effective_agent_enrollment_frontend_port: "{{ 15150 if ('wazuh_managers' in group_names and (wazuh_lb_agent_enrollment_frontend_port | default(1515) | int) == 1515) else (wazuh_lb_agent_enrollment_frontend_port | default(1515) | int) }}"
    wazuh_lb_effective_api_frontend_port: "{{ 55001 if ('wazuh_managers' in group_names and (wazuh_lb_api_frontend_port | default(55000) | int) == 55000) else (wazuh_lb_api_frontend_port | default(55000) | int) }}"
    wazuh_lb_effective_dashboard_frontend_port: "{{ 8443 if ('wazuh_dashboards' in group_names and (wazuh_lb_dashboard_frontend_port | default(443) | int) == (wazuh_dashboard_port | default(443) | int)) else (wazuh_lb_dashboard_frontend_port | default(443) | int) }}"
    wazuh_lb_effective_indexer_api_frontend_port: "{{ 9201 if (wazuh_lb_expose_indexer_api | default(false) | bool and 'wazuh_indexers' in group_names and (wazuh_lb_indexer_api_frontend_port | default(9200) | int) == 9200) else (wazuh_lb_indexer_api_frontend_port | default(9200) | int) }}"

- name: Show effective load balancer frontend ports
  ansible.builtin.debug:
    msg: >-
      Load balancer frontend ports on {{ inventory_hostname }}:
      events={{ wazuh_lb_effective_agent_events_frontend_port }},
      enrollment={{ wazuh_lb_effective_agent_enrollment_frontend_port }},
      api={{ wazuh_lb_effective_api_frontend_port }},
      dashboard={{ wazuh_lb_effective_dashboard_frontend_port }},
      indexer_api={{ wazuh_lb_effective_indexer_api_frontend_port }}.

- name: Prevent load balancer frontend port conflicts on converged hosts
  ansible.builtin.assert:
    that:
      - >-
        'wazuh_managers' not in group_names
        or (
          (wazuh_lb_effective_agent_events_frontend_port | int) != 1514
          and (wazuh_lb_effective_agent_enrollment_frontend_port | int) != 1515
          and (wazuh_lb_effective_api_frontend_port | int) != 55000
        )
      - >-
        'wazuh_dashboards' not in group_names
        or (wazuh_lb_effective_dashboard_frontend_port | int) != (wazuh_dashboard_port | default(443) | int)
      - >-
        not (wazuh_lb_expose_indexer_api | default(false) | bool)
        or 'wazuh_indexers' not in group_names
        or (wazuh_lb_effective_indexer_api_frontend_port | int) != 9200
    fail_msg: >-
      This host also runs Wazuh components, so the load balancer cannot use
      the same frontend ports as the local manager, dashboard, or indexer services.
      Use dedicated load balancer hosts, or set non-conflicting
      wazuh_lb_*_frontend_port values in inventory.
  when: wazuh_load_balancer_engine != 'none'

- name: Configure HAProxy load balancer
  ansible.builtin.include_tasks: haproxy.yml
  when: wazuh_load_balancer_engine == 'haproxy'

- name: Configure NGINX stream load balancer
  ansible.builtin.include_tasks: nginx.yml
  when: wazuh_load_balancer_engine == 'nginx'

- name: Configure Keepalived VIP
  ansible.builtin.include_tasks: keepalived.yml
  when: wazuh_keepalived_effective_enabled | bool

- name: Apply pending load balancer handlers before verification
  ansible.builtin.meta: flush_handlers

- name: Verify Keepalived remains active after handler flush
  ansible.builtin.command:
    cmd: systemctl is-active keepalived
  register: wazuh_keepalived_state_after_flush
  changed_when: false
  failed_when: wazuh_keepalived_state_after_flush.stdout | default('') != 'active'
  when: wazuh_keepalived_effective_enabled | bool

- name: Build load balancer frontend port check list
  ansible.builtin.set_fact:
    wazuh_lb_frontend_ports_to_check: >-
      {{
        [
          wazuh_lb_effective_agent_events_frontend_port | int,
          wazuh_lb_effective_agent_enrollment_frontend_port | int,
          wazuh_lb_effective_api_frontend_port | int,
          wazuh_lb_effective_dashboard_frontend_port | int
        ]
        + ([wazuh_lb_effective_indexer_api_frontend_port | int] if (wazuh_lb_expose_indexer_api | default(false) | bool) else [])
      }}
  when: wazuh_load_balancer_engine != 'none'

- name: Check load balancer service state after handler flush
  ansible.builtin.command:
    cmd: "systemctl is-active {{ 'haproxy' if wazuh_load_balancer_engine == 'haproxy' else 'nginx' }}"
  register: wazuh_lb_service_state_after_flush
  changed_when: false
  failed_when: false
  when: wazuh_load_balancer_engine != 'none'

- name: Check load balancer listeners after handler flush
  ansible.builtin.command:
    cmd: ss -H -lntp
  register: wazuh_lb_listeners_after_flush
  changed_when: false
  failed_when: false
  when: wazuh_load_balancer_engine != 'none'

- name: Report load balancer frontend listener state
  ansible.builtin.debug:
    msg: |
      {{ inventory_hostname }} {{ wazuh_load_balancer_engine }} state={{ wazuh_lb_service_state_after_flush.stdout | default('unknown') }}
      expected_frontend_ports={{ wazuh_lb_frontend_ports_to_check | default([]) }}
      listeners:
      {{ wazuh_lb_listeners_after_flush.stdout_lines | default([]) | select('search', ':(1514|1515|15140|15150|443|8443|55000|55001|9200|9201)\\b') | list | join('\n') }}
  when: wazuh_load_balancer_engine != 'none'

- name: Wait for load balancer frontend ports on node address
  ansible.builtin.wait_for:
    host: "{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}"
    port: "{{ item }}"
    timeout: 20
  loop: "{{ wazuh_lb_frontend_ports_to_check | default([]) }}"
  delegate_to: localhost
  become: false
  when: wazuh_load_balancer_engine != 'none'

- name: Select load balancer VIP check host
  ansible.builtin.set_fact:
    wazuh_lb_vip_check_host: "{{ wazuh_lb_virtual_ip | regex_replace('/.*$', '') }}"
  when:
    - wazuh_load_balancer_engine != 'none'
    - wazuh_keepalived_effective_enabled | bool
    - wazuh_lb_virtual_ip | default('') | length > 0

- name: Wait briefly for Keepalived VIP election
  ansible.builtin.pause:
    seconds: 3
  run_once: true
  when:
    - wazuh_load_balancer_engine != 'none'
    - wazuh_lb_vip_check_host is defined

- name: Check load balancer interface addresses after Keepalived start
  ansible.builtin.command:
    cmd: "ip -o address show dev {{ wazuh_keepalived_interface | default('eth0') }}"
  register: wazuh_lb_addresses_after_keepalived
  changed_when: false
  failed_when: false
  when:
    - wazuh_load_balancer_engine != 'none'
    - wazuh_lb_vip_check_host is defined

- name: Build VIP owner list after Keepalived start
  ansible.builtin.set_fact:
    wazuh_lb_vip_owner_hosts: "{{ (wazuh_lb_vip_owner_hosts | default([])) + ([item] if (wazuh_lb_vip_check_host in (hostvars[item].wazuh_lb_addresses_after_keepalived.stdout | default(''))) else []) }}"
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  when:
    - wazuh_load_balancer_engine != 'none'
    - wazuh_lb_vip_check_host is defined

- name: Validate Keepalived VIP ownership
  ansible.builtin.assert:
    that:
      - wazuh_lb_vip_owner_hosts | default([]) | length > 0
    fail_msg: >-
      No load balancer node owns {{ wazuh_lb_vip_check_host }} on
      {{ wazuh_keepalived_interface | default('eth0') }} after Keepalived start.
      Check systemctl status keepalived and journalctl -u keepalived.
    success_msg: "VIP {{ wazuh_lb_vip_check_host }} is owned by {{ wazuh_lb_vip_owner_hosts | join(', ') }}."
  run_once: true
  when:
    - wazuh_load_balancer_engine != 'none'
    - wazuh_lb_vip_check_host is defined

- name: Wait for load balancer dashboard frontend port on VIP
  ansible.builtin.wait_for:
    host: "{{ wazuh_lb_vip_check_host }}"
    port: "{{ wazuh_lb_effective_dashboard_frontend_port }}"
    timeout: 20
  delegate_to: localhost
  become: false
  when:
    - wazuh_load_balancer_engine != 'none'
    - wazuh_lb_vip_check_host is defined
