---
- name: Require VIP when Keepalived is enabled
  ansible.builtin.assert:
    that:
      - wazuh_lb_virtual_ip | default('') | length > 0
    fail_msg: "Set wazuh_lb_virtual_ip when wazuh_enable_keepalived=true."

- name: Require a load balancer service when Keepalived is enabled
  ansible.builtin.assert:
    that:
      - wazuh_load_balancer_engine | default('none') in ['haproxy', 'nginx']
    fail_msg: >-
      Keepalived VIP failover requires a local load balancer service. Set
      wazuh_load_balancer_engine to haproxy or nginx.

- name: Require Keepalived auth password
  ansible.builtin.assert:
    that:
      - wazuh_keepalived_auth_pass is defined
      - wazuh_keepalived_auth_pass | string | length > 0
      - wazuh_keepalived_auth_pass | string != 'CHANGE_ME'
    fail_msg: >-
      Set wazuh_keepalived_auth_pass to a shared VRRP password, or define
      vault_wazuh_keepalived_auth_pass if your inventory references it.

- name: Validate Keepalived VRRP settings
  ansible.builtin.assert:
    that:
      - wazuh_keepalived_router_id | int >= 1
      - wazuh_keepalived_router_id | int <= 255
      - wazuh_keepalived_auth_pass | string | length <= 8
      - wazuh_keepalived_advert_int | default(1) | int >= 1
      - wazuh_keepalived_down_timer_adverts | default(1) | int >= 1
    fail_msg: >-
      Keepalived requires virtual_router_id between 1 and 255, PASS auth
      passwords of 8 characters or fewer, and positive advert/down-timer values.

- name: Validate Keepalived unicast peers
  ansible.builtin.assert:
    that:
      - groups.get('wazuh_loadbalancers', []) | length > 1
    fail_msg: >-
      Keepalived unicast mode needs at least two hosts in the
      wazuh_loadbalancers group so peers can be rendered.
  when: wazuh_keepalived_unicast_enabled | default(false) | bool

- name: Determine Keepalived package family key
  ansible.builtin.set_fact:
    wazuh_keepalived_package_family_key: "{{ ansible_os_family if ansible_os_family in wazuh_keepalived_packages_by_family else (ansible_distribution if ansible_distribution in wazuh_keepalived_packages_by_family else ansible_os_family) }}"

- name: Install Keepalived
  ansible.builtin.package:
    name: "{{ wazuh_keepalived_packages_by_family.get(wazuh_keepalived_package_family_key, ['keepalived']) }}"
    state: present

- name: Install Keepalived load balancer health check
  ansible.builtin.template:
    src: keepalived-check-lb.sh.j2
    dest: /usr/local/sbin/wazuh-keepalived-check-lb
    owner: root
    group: root
    mode: "0755"
  notify: Restart keepalived

- name: Configure Keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
    validate: keepalived -t -f %s
  notify: Restart keepalived

- name: Enable and start Keepalived
  block:
    - name: Start Keepalived service
      ansible.builtin.service:
        name: keepalived
        enabled: true
        state: started
  rescue:
    - name: Collect Keepalived systemd status
      ansible.builtin.command:
        cmd: systemctl status keepalived --no-pager -l
      register: wazuh_keepalived_systemd_status
      changed_when: false
      failed_when: false

    - name: Collect recent Keepalived journal
      ansible.builtin.command:
        cmd: journalctl -u keepalived -n 120 --no-pager
      register: wazuh_keepalived_journal
      changed_when: false
      failed_when: false

    - name: Report Keepalived startup diagnostics
      ansible.builtin.fail:
        msg: |
          Keepalived failed to start on {{ inventory_hostname }}.

          systemctl status keepalived:
          {{ wazuh_keepalived_systemd_status.stdout | default(wazuh_keepalived_systemd_status.stderr | default('unavailable')) }}

          journalctl -u keepalived -n 120:
          {{ wazuh_keepalived_journal.stdout | default(wazuh_keepalived_journal.stderr | default('unavailable')) }}

- name: Verify Keepalived is active
  ansible.builtin.command:
    cmd: systemctl is-active keepalived
  register: wazuh_keepalived_active_state
  changed_when: false
  failed_when: wazuh_keepalived_active_state.stdout | default('') != 'active'
