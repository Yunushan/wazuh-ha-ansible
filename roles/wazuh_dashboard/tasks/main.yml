---
- name: Build dashboard installer command
  ansible.builtin.set_fact:
    wazuh_dashboard_install_command: >-
      bash ./wazuh-install.sh --wazuh-dashboard {{ wazuh_dashboard_name | default(inventory_hostname ~ '-dashboard') }}
      {% if wazuh_dashboard_port | default(443) | int != 443 %}-p {{ wazuh_dashboard_port }}{% endif %}

- name: Install Wazuh dashboard component
  ansible.builtin.command:
    cmd: "{{ wazuh_dashboard_install_command }}"
    chdir: "{{ wazuh_install_workdir }}"
    creates: /etc/wazuh-dashboard/opensearch_dashboards.yml
  register: wazuh_dashboard_install
  no_log: true

- name: Replace existing Wazuh dashboard port settings
  ansible.builtin.replace:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^[#\s]*server[.]port:.*$'
    replace: "server.port: {{ wazuh_dashboard_port | default(443) }}"
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0660"
  register: wazuh_dashboard_port_replace

- name: Ensure Wazuh dashboard port setting exists
  ansible.builtin.lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^server[.]port:'
    line: "server.port: {{ wazuh_dashboard_port | default(443) }}"
    insertafter: EOF
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0660"
  register: wazuh_dashboard_port_line

- name: Restart Wazuh dashboard after port change
  ansible.builtin.service:
    name: wazuh-dashboard
    state: restarted
  when: wazuh_dashboard_port_replace.changed or wazuh_dashboard_port_line.changed

- name: Ensure Wazuh dashboard service is enabled and started
  ansible.builtin.service:
    name: wazuh-dashboard
    enabled: true
    state: started

- name: Configure Wazuh dashboard backend firewall
  when: wazuh_dashboard_backend_firewall_enabled | default(false) | bool
  block:
    - name: Install nftables for dashboard backend firewall
      ansible.builtin.package:
        name: nftables
        state: present

    - name: Ensure nftables include directory exists
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render dashboard backend nftables rules
      ansible.builtin.template:
        src: dashboard-backend-firewall.nft.j2
        dest: /etc/nftables.d/wazuh-dashboard-backend.nft
        owner: root
        group: root
        mode: "0644"
      register: wazuh_dashboard_backend_firewall_rules

    - name: Validate dashboard backend nftables rules
      ansible.builtin.command:
        cmd: nft -c -f /etc/nftables.d/wazuh-dashboard-backend.nft
      changed_when: false

    - name: Install dashboard backend firewall systemd unit
      ansible.builtin.template:
        src: wazuh-dashboard-backend-firewall.service.j2
        dest: /etc/systemd/system/wazuh-dashboard-backend-firewall.service
        owner: root
        group: root
        mode: "0644"
      register: wazuh_dashboard_backend_firewall_unit

    - name: Enable dashboard backend firewall
      ansible.builtin.systemd:
        name: wazuh-dashboard-backend-firewall
        enabled: true
        state: "{{ 'restarted' if (wazuh_dashboard_backend_firewall_rules.changed or wazuh_dashboard_backend_firewall_unit.changed) else 'started' }}"
        daemon_reload: true

- name: Remove Wazuh dashboard backend firewall
  when: not (wazuh_dashboard_backend_firewall_enabled | default(false) | bool)
  block:
    - name: Disable dashboard backend firewall unit
      ansible.builtin.systemd:
        name: wazuh-dashboard-backend-firewall
        enabled: false
        state: stopped
        daemon_reload: true
      failed_when: false

    - name: Remove dashboard backend firewall files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nftables.d/wazuh-dashboard-backend.nft
        - /etc/systemd/system/wazuh-dashboard-backend-firewall.service

    - name: Reload systemd after dashboard backend firewall removal
      ansible.builtin.systemd:
        daemon_reload: true
