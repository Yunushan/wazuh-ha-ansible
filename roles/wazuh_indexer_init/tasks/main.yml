---
- name: Wait for local Wazuh indexer API before cluster initialization
  ansible.builtin.wait_for:
    host: "{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}"
    port: 9200
    timeout: 120

- name: Wait for all Wazuh indexer APIs before cluster initialization
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].wazuh_node_ip | default(hostvars[item].ansible_host | default(item)) }}"
    port: 9200
    timeout: 180
  loop: "{{ groups.get('wazuh_indexers', []) }}"

- name: Initialize Wazuh indexer cluster once
  ansible.builtin.command:
    cmd: bash ./wazuh-install.sh --start-cluster
    chdir: "{{ wazuh_install_workdir }}"
  register: wazuh_start_cluster_result
  changed_when: true
  no_log: true

- name: Wait for all indexer nodes to answer on 9200
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].wazuh_node_ip | default(hostvars[item].ansible_host | default(item)) }}"
    port: 9200
    timeout: 120
  loop: "{{ groups.get('wazuh_indexers', []) }}"
