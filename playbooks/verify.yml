---
- name: Verify Wazuh indexer ports
  hosts: wazuh_indexers
  become: false
  gather_facts: false
  tasks:
    - name: Wait for indexer API port
      ansible.builtin.wait_for:
        host: "{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}"
        port: 9200
        timeout: 20
      delegate_to: localhost
      become: false

- name: Verify Wazuh manager ports
  hosts: wazuh_managers
  become: false
  gather_facts: false
  tasks:
    - name: Wait for Wazuh agent event port
      ansible.builtin.wait_for:
        host: "{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}"
        port: 1514
        timeout: 20
      delegate_to: localhost
      become: false

    - name: Wait for Wazuh API port
      ansible.builtin.wait_for:
        host: "{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}"
        port: 55000
        timeout: 20
      delegate_to: localhost
      become: false

- name: Verify Wazuh dashboard ports
  hosts: wazuh_dashboards
  become: false
  gather_facts: false
  tasks:
    - name: Wait for dashboard HTTPS port
      ansible.builtin.wait_for:
        host: "{{ wazuh_node_ip | default(ansible_host | default(inventory_hostname)) }}"
        port: "{{ wazuh_dashboard_port | default(443) }}"
        timeout: 20
      delegate_to: localhost
      become: false

- name: Verify load balancer VIP or node ports
  hosts: wazuh_loadbalancers
  become: true
  gather_facts: false
  tasks:
    - name: Select load balancer check host
      ansible.builtin.set_fact:
        wazuh_lb_check_host: "{{ (wazuh_lb_virtual_ip | default('') | regex_replace('/.*$', '')) if (wazuh_enable_keepalived | default(false) | bool and wazuh_lb_virtual_ip | default('') | length > 0) else (wazuh_node_ip | default(ansible_host | default(inventory_hostname))) }}"

    - name: Determine effective Keepalived state for verification
      ansible.builtin.set_fact:
        wazuh_keepalived_effective_enabled: "{{ (wazuh_enable_keepalived | default(false) | bool) or (wazuh_lb_virtual_ip | default('') | length > 0) }}"
        wazuh_lb_check_host: "{{ (wazuh_lb_virtual_ip | default('') | regex_replace('/.*$', '')) if (((wazuh_enable_keepalived | default(false) | bool) or (wazuh_lb_virtual_ip | default('') | length > 0)) and wazuh_lb_virtual_ip | default('') | length > 0) else (wazuh_node_ip | default(ansible_host | default(inventory_hostname))) }}"

    - name: Determine effective load balancer check ports
      ansible.builtin.set_fact:
        wazuh_lb_check_agent_events_port: "{{ 15140 if ('wazuh_managers' in group_names and (wazuh_lb_agent_events_frontend_port | default(1514) | int) == 1514) else (wazuh_lb_agent_events_frontend_port | default(1514) | int) }}"
        wazuh_lb_check_agent_enrollment_port: "{{ 15150 if ('wazuh_managers' in group_names and (wazuh_lb_agent_enrollment_frontend_port | default(1515) | int) == 1515) else (wazuh_lb_agent_enrollment_frontend_port | default(1515) | int) }}"
        wazuh_lb_check_api_port: "{{ 55001 if ('wazuh_managers' in group_names and (wazuh_lb_api_frontend_port | default(55000) | int) == 55000) else (wazuh_lb_api_frontend_port | default(55000) | int) }}"
        wazuh_lb_check_dashboard_port: "{{ 8443 if ('wazuh_dashboards' in group_names and (wazuh_lb_dashboard_frontend_port | default(443) | int) == (wazuh_dashboard_port | default(443) | int)) else (wazuh_lb_dashboard_frontend_port | default(443) | int) }}"
        wazuh_lb_check_indexer_api_port: "{{ 9201 if (wazuh_lb_expose_indexer_api | default(false) | bool and 'wazuh_indexers' in group_names and (wazuh_lb_indexer_api_frontend_port | default(9200) | int) == 9200) else (wazuh_lb_indexer_api_frontend_port | default(9200) | int) }}"

    - name: Show load balancer verification endpoints
      ansible.builtin.debug:
        msg: >-
          Checking load balancer {{ wazuh_lb_check_host }} ports:
          events={{ wazuh_lb_check_agent_events_port }},
          enrollment={{ wazuh_lb_check_agent_enrollment_port }},
          api={{ wazuh_lb_check_api_port }},
          dashboard_https={{ wazuh_lb_check_dashboard_port }},
          indexer_api={{ wazuh_lb_check_indexer_api_port }}.

    - name: Wait for load-balanced agent event port
      ansible.builtin.wait_for:
        host: "{{ wazuh_lb_check_host }}"
        port: "{{ wazuh_lb_check_agent_events_port }}"
        timeout: 20
      delegate_to: localhost
      become: false

    - name: Wait for load-balanced agent enrollment port
      ansible.builtin.wait_for:
        host: "{{ wazuh_lb_check_host }}"
        port: "{{ wazuh_lb_check_agent_enrollment_port }}"
        timeout: 20
      delegate_to: localhost
      become: false

    - name: Wait for load-balanced Wazuh API port
      ansible.builtin.wait_for:
        host: "{{ wazuh_lb_check_host }}"
        port: "{{ wazuh_lb_check_api_port }}"
        timeout: 20
      delegate_to: localhost
      become: false

    - name: Wait for load-balanced dashboard HTTPS port
      ansible.builtin.wait_for:
        host: "{{ wazuh_lb_check_host }}"
        port: "{{ wazuh_lb_check_dashboard_port }}"
        timeout: 20
      delegate_to: localhost
      become: false

    - name: Wait for load-balanced indexer API port
      ansible.builtin.wait_for:
        host: "{{ wazuh_lb_check_host }}"
        port: "{{ wazuh_lb_check_indexer_api_port }}"
        timeout: 20
      delegate_to: localhost
      become: false
      when: wazuh_lb_expose_indexer_api | default(false) | bool

    - name: Check VIP address assignment on load balancer node
      ansible.builtin.command:
        cmd: "ip -o address show dev {{ wazuh_keepalived_interface | default('eth0') }}"
      register: wazuh_lb_ip_addresses
      changed_when: false
      failed_when: false

    - name: Build load balancer VIP owner list
      ansible.builtin.set_fact:
        wazuh_lb_vip_owner_hosts: "{{ (wazuh_lb_vip_owner_hosts | default([])) + ([item] if (wazuh_lb_check_host in (hostvars[item].wazuh_lb_ip_addresses.stdout | default(''))) else []) }}"
      loop: "{{ ansible_play_hosts }}"
      run_once: true
      when: wazuh_keepalived_effective_enabled | bool

    - name: Validate at least one load balancer owns the VIP
      ansible.builtin.assert:
        that:
          - wazuh_lb_vip_owner_hosts | default([]) | length > 0
        fail_msg: >-
          No load balancer node currently owns {{ wazuh_lb_check_host }}.
          Keepalived must be active on at least one node and the VIP must be
          assigned to {{ wazuh_keepalived_interface | default('eth0') }}.
        success_msg: "VIP {{ wazuh_lb_check_host }} is owned by {{ wazuh_lb_vip_owner_hosts | join(', ') }}."
      run_once: true
      when: wazuh_keepalived_effective_enabled | bool

    - name: Check load balancer TCP listeners on node
      ansible.builtin.command:
        cmd: ss -H -lntp
      register: wazuh_lb_tcp_listeners
      changed_when: false
      failed_when: false

    - name: Check Keepalived service state
      ansible.builtin.command:
        cmd: systemctl is-active keepalived
      register: wazuh_lb_keepalived_state
      changed_when: false
      failed_when: false
      when: wazuh_keepalived_effective_enabled | bool

    - name: Check load balancer service state
      ansible.builtin.command:
        cmd: "systemctl is-active {{ 'haproxy' if wazuh_load_balancer_engine == 'haproxy' else 'nginx' }}"
      register: wazuh_lb_service_state
      changed_when: false
      failed_when: false
      when: wazuh_load_balancer_engine in ['haproxy', 'nginx']

    - name: Report load balancer node state
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }} load balancer state:
          interface={{ wazuh_keepalived_interface | default('eth0') }}
          vip={{ wazuh_lb_virtual_ip | default('') }}
          keepalived={{ wazuh_lb_keepalived_state.stdout | default('not checked') }}
          {{ wazuh_load_balancer_engine }}={{ wazuh_lb_service_state.stdout | default('not checked') }}

          Addresses:
          {{ wazuh_lb_ip_addresses.stdout | default('unavailable') }}

          Relevant listeners:
          {{ wazuh_lb_tcp_listeners.stdout_lines | default([]) | select('search', ':(1514|1515|15140|15150|443|8443|55000|55001|9200|9201)\\b') | list | join('\n') }}

    - name: Validate VIP owner has an active load balancer listener
      ansible.builtin.assert:
        that:
          - wazuh_lb_service_state.stdout | default('') == 'active'
          - >-
            (wazuh_lb_tcp_listeners.stdout_lines | default([])
            | select('search', ':' ~ (wazuh_lb_check_dashboard_port | string) ~ '\\b')
            | list | length) > 0
        fail_msg: >-
          {{ inventory_hostname }} currently owns {{ wazuh_lb_check_host }}
          but {{ wazuh_load_balancer_engine }} is not listening on dashboard
          frontend port {{ wazuh_lb_check_dashboard_port }}.
          Check systemctl status {{ wazuh_load_balancer_engine }} and
          /etc/{{ 'haproxy/haproxy.cfg' if wazuh_load_balancer_engine == 'haproxy' else 'nginx/stream.d/wazuh.conf' }}.
      when:
        - wazuh_keepalived_effective_enabled | bool
        - wazuh_lb_check_host in (wazuh_lb_ip_addresses.stdout | default(''))
